<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>拉斯维加斯德州扑克</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/mobile.css">
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <meta name="description" content="一个精美的在线德州扑克游戏，支持多人对战和移动端">
    <meta name="theme-color" content="#000000">
    <!-- 苹果系统字体 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap">
    <!-- JavaScript 文件 -->
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/ui.js"></script>
    <script type="module" src="js/game.js"></script>
    <script type="module" src="js/poker.js"></script>
    <script type="module" src="js/leaderboard.js"></script>
    <script type="module" src="js/achievements.js"></script>
    <script type="module" src="js/touch.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M60 10L110 60L60 110L10 60L60 10Z" fill="#D4AF37"/>
                        <path d="M60 30L90 60L60 90L30 60L60 30Z" fill="#0A0A0A"/>
                        <text x="60" y="65" text-anchor="middle" fill="#D4AF37" font-size="14">VEGAS POKER</text>
                    </svg>
                </div>
                <h1 class="sidebar-title">拉斯维加斯德州扑克</h1>
            </div>
            
            <!-- 玩家信息 -->
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">玩家信息</h3>
                </div>
                <div class="player-info">
                    <div class="avatar-display">
                        <img id="current-avatar" src="" alt="当前头像">
                        <span id="player-name-display"></span>
                    </div>
                    <div class="player-stats">
                        <div class="stat-item">
                            <span class="stat-label">总胜场</span>
                            <span id="total-wins" class="stat-value">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">最大赢池</span>
                            <span id="biggest-pot" class="stat-value">0</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 排行榜 -->
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">排行榜</h3>
                </div>
                <div class="leaderboard" id="leaderboard">
                    <!-- 排行榜项目将通过JavaScript动态添加 -->
                </div>
            </div>
            
            <!-- 成就系统 -->
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">成就</h3>
                </div>
                <div class="achievements" id="achievements">
                    <!-- 成就徽章将通过JavaScript动态添加 -->
                </div>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 欢迎界面 -->
            <div id="welcome-screen" class="main-screen active">
                <div class="glass card">
                    <div class="card-header">
                        <h2 class="card-title">欢迎来到拉斯维加斯</h2>
                    </div>
                    <div class="input-group">
                        <label class="input-label" for="player-name">您的名字</label>
                        <input type="text" id="player-name" class="input-field" placeholder="请输入玩家名称">
                    </div>
                    <div class="avatar-selection">
                        <label class="input-label">选择您的头像</label>
                        <div id="avatar-grid" class="avatar-grid">
                            <!-- 头像选项将通过JavaScript动态添加 -->
                        </div>
                    </div>
                    <div class="button-group">
                        <button id="create-room" class="btn btn-primary">创建房间</button>
                        <button id="join-room" class="btn">加入房间</button>
                        <button id="show-tutorial" class="btn btn-text">查看教程</button>
                    </div>
                </div>
            </div>

            <!-- 创建房间界面 -->
            <div id="create-room-screen" class="main-screen">
                <div class="glass card">
                    <div class="card-header">
                        <h2 class="card-title">创建房间</h2>
                    </div>
                    <div class="input-group">
                        <label class="input-label" for="room-name">房间名称</label>
                        <input type="text" id="room-name" class="input-field" placeholder="请输入房间名称">
                    </div>
                    <div class="input-group">
                        <label class="input-label" for="player-count">玩家人数</label>
                        <input type="range" id="player-count" min="4" max="9" value="6">
                        <span id="player-count-value">6人</span>
                    </div>
                    <div class="input-group">
                        <label class="input-label" for="small-blind">小盲注</label>
                        <input type="number" id="small-blind" class="input-field" value="5" min="1">
                    </div>
                    <div class="input-group">
                        <label class="input-label" for="big-blind">大盲注</label>
                        <input type="number" id="big-blind" class="input-field" value="10" min="2">
                    </div>
                    <div class="input-group">
                        <label class="input-label" for="initial-chips">初始筹码</label>
                        <input type="number" id="initial-chips" class="input-field" value="1000" min="100">
                    </div>
                    <div class="button-group">
                        <button id="confirm-create" class="btn btn-primary">创建</button>
                        <button id="back-from-create" class="btn">返回</button>
                    </div>
                </div>
            </div>

            <!-- 加入房间界面 -->
            <div id="join-room-screen" class="main-screen">
                <div class="glass card">
                    <div class="card-header">
                        <h2 class="card-title">加入房间</h2>
                    </div>
                    <div class="room-code-input">
                        <label class="input-label" for="room-code-input">房间号</label>
                        <div class="input-group">
                            <input type="text" id="room-code-input" class="input-field" placeholder="输入6位房间号">
                            <button id="paste-room-code" class="btn btn-icon">
                                <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M8 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z"/>
                                    <path d="M6 3a2 2 0 00-2 2v11a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2 3 3 0 01-3 3H9a3 3 0 01-3-3z"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="active-rooms">
                        <h3>活跃房间</h3>
                        <div id="active-rooms" class="room-list">
                            <!-- 活跃房间列表将通过JavaScript动态添加 -->
                        </div>
                    </div>
                    <div class="button-group">
                        <button id="confirm-join" class="btn btn-primary">加入</button>
                        <button id="back-from-join" class="btn">返回</button>
                    </div>
                </div>
            </div>

            <!-- 等待房间界面 -->
            <div id="waiting-room-screen" class="main-screen">
                <div class="glass card">
                    <div class="card-header">
                        <h2 class="card-title">等待其他玩家</h2>
                        <div class="room-code">
                            房间号：<span id="display-room-code"></span>
                            <button id="copy-room-code" class="btn btn-icon">
                                <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M8 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z"/>
                                    <path d="M6 3a2 2 0 00-2 2v11a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2 3 3 0 01-3 3H9a3 3 0 01-3-3z"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="settings-summary">
                        <p>小盲注：<span id="small-blind-display">5</span></p>
                        <p>大盲注：<span id="big-blind-display">10</span></p>
                        <p>初始筹码：<span id="initial-chips-display">1000</span></p>
                        <p>玩家数量：<span id="player-count-display">1</span>/<span id="max-player-display">6</span></p>
                    </div>
                    <div id="waiting-player-list" class="player-list">
                        <!-- 玩家列表将通过JavaScript动态添加 -->
                    </div>
                    <div class="button-group">
                        <button id="start-game" class="btn btn-primary disabled" disabled>开始游戏</button>
                        <button id="leave-room" class="btn">离开房间</button>
                    </div>
                </div>
            </div>

            <!-- 游戏界面 -->
            <div id="game-screen" class="main-screen">
                <div class="poker-table">
                    <div class="table-felt"></div>
                    <div class="community-cards">
                        <!-- 公共牌将通过JavaScript动态添加 -->
                    </div>
                    <div class="pot">
                        <div class="chip-stack">
                            <!-- 筹码将通过JavaScript动态添加 -->
                        </div>
                        <span class="pot-amount">0</span>
                    </div>
                    <div class="player-seats">
                        <!-- 玩家座位将通过JavaScript动态添加 -->
                    </div>
                    <div class="action-panel glass">
                        <div class="action-buttons">
                            <button class="btn btn-primary" data-action="call">跟注</button>
                            <button class="btn btn-primary" data-action="raise">加注</button>
                            <button class="btn" data-action="fold">弃牌</button>
                        </div>
                        <div class="bet-slider">
                            <input type="range" id="bet-amount" min="0" max="1000" value="0">
                            <span id="bet-amount-display">0</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 教程界面 -->
            <div id="tutorial-screen" class="main-screen">
                <div class="glass card">
                    <div class="card-header">
                        <h2 class="card-title">游戏教程</h2>
                    </div>
                    <div class="tutorial-navigation">
                        <button class="tutorial-nav active" data-target="basics">基础规则</button>
                        <button class="tutorial-nav" data-target="hands">牌型大小</button>
                        <button class="tutorial-nav" data-target="betting">下注规则</button>
                        <button class="tutorial-nav" data-target="terms">术语说明</button>
                    </div>
                    <div class="tutorial-content">
                        <div id="tutorial-basics" class="tutorial-section active">
                            <!-- 基础规则内容 -->
                        </div>
                        <div id="tutorial-hands" class="tutorial-section">
                            <!-- 牌型大小内容 -->
                        </div>
                        <div id="tutorial-betting" class="tutorial-section">
                            <!-- 下注规则内容 -->
                        </div>
                        <div id="tutorial-terms" class="tutorial-section">
                            <!-- 术语说明内容 -->
                        </div>
                    </div>
                    <div class="button-group">
                        <button id="back-from-tutorial" class="btn">返回</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 模态框 -->
    <div id="modal" class="modal">
        <div class="modal-content glass">
            <h3 id="modal-title"></h3>
            <div id="modal-body"></div>
            <div id="modal-footer"></div>
        </div>
    </div>

    <!-- 加载动画 -->
    <div id="loading" class="loading-overlay">
        <div class="loading-spinner"></div>
    </div>

    <!-- Toast提示 -->
    <div id="toast" class="toast"></div>

    <!-- 禁用双击缩放 -->
    <script>
        document.addEventListener('touchstart', function(event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });
        
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
